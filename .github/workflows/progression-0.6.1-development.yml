name: Progression 0.6.1 development verification
on:
  push:
    branches: [v0.6.1-progression-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/test_progression_0_6_1.py

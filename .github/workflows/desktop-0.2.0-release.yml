name: Build WoTQuartermaster desktop 0.2.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-0.2.0-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release-0.2.0
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PySide6==6.8.3 Pillow==11.3.0 PyInstaller==6.14.2
      - name: Syntax and updater safety checks
        shell: pwsh
        run: |
          $actual = (git hash-object desktop/WoTQuartermaster_v0.2.0.txt).Trim()
          if ($actual -ne '0192b33ea1bc07b4b8c9de125e1402af1680d4e3') { throw 'Source hash mismatch' }
          Copy-Item desktop/WoTQuartermaster_v0.2.0.txt WoTQuartermaster.py
          python -m py_compile WoTQuartermaster.py
          if ($LASTEXITCODE -ne 0) { throw 'Syntax failed' }
          python desktop/test_updater_v0.2.0.txt
          if ($LASTEXITCODE -ne 0) { throw 'Updater safety checks failed' }
          python WoTQuartermaster.py --check-data "${{ runner.temp }}/quartermaster-empty-test"
          if ($LASTEXITCODE -ne 0) { throw 'Data check failed' }
      - name: Compile standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WoTQuartermaster --hidden-import PIL.DdsImagePlugin WoTQuartermaster.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $file = Get-Item dist/WoTQuartermaster.exe
          if ($file.Length -lt 100000) { throw 'Executable too small' }
          $stream = [System.IO.File]::OpenRead($file.FullName)
          try { if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw 'Invalid PE executable' } } finally { $stream.Dispose() }
      - name: Smoke test compiled executable
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'quartermaster-updater-smoke'
          New-Item -ItemType Directory -Force $testDir | Out-Null
          Copy-Item dist/WoTQuartermaster.exe $testDir
          $env:QT_QPA_PLATFORM = 'offscreen'
          $proc = Start-Process -FilePath (Join-Path $testDir 'WoTQuartermaster.exe') -WorkingDirectory $testDir -PassThru
          try {
            Start-Sleep -Seconds 20
            $proc.Refresh()
            if ($proc.HasExited) { throw "Desktop startup failed: $($proc.ExitCode)" }
            if (!(Test-Path (Join-Path $testDir 'data/database/quartermaster.sqlite3'))) { throw 'Database not created' }
            $log = Join-Path $testDir 'logs/desktop.log'
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Fatal desktop error|Refresh failed' -Quiet)) { Get-Content $log; throw 'Desktop startup errors' }
          } finally {
            Get-Process WoTQuartermaster -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Publish verified components
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'dist/WoTQuartermaster.exe'
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/WoTQuartermaster.sha256.txt -Value "$digest  WoTQuartermaster.exe" -Encoding ascii
          gh release view v0.2.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.2.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WoTQuartermaster v0.2.0 Alpha" --prerelease --notes "Integrated component updater. Independent versions, HTTPS manifest, SHA-256 checks, manual approval before desktop replacement, previous executable backup and recovery, Connector download and INI preparation, replay component management. Replace the previous EXE manually once; preserve data and settings. Actual Windows self-updating and rollback remain to be tested in the next maintenance release." $exe dist/WoTQuartermaster.sha256.txt
            if ($LASTEXITCODE -ne 0) { throw 'Desktop release failed' }
          }
          if ((git hash-object replay/WoT_Quartermaster_Replay_Parser_v0.0.7.txt).Trim() -ne '233f7c6b5640b128986b79a5bc7356a82942427c') { throw 'Replay source changed' }
          Copy-Item replay/WoT_Quartermaster_Replay_Parser_v0.0.7.txt dist/WoT_Quartermaster_Replay_Parser.txt
          python -m py_compile dist/WoT_Quartermaster_Replay_Parser.txt
          if ($LASTEXITCODE -ne 0) { throw 'Replay syntax failed' }
          gh release view replay-v0.0.7 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create replay-v0.0.7 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Replay importer 0.0.7 (component)" --prerelease --notes "Unchanged replay importer component. Downloaded by the desktop updater; automatic execution is deferred." dist/WoT_Quartermaster_Replay_Parser.txt
            if ($LASTEXITCODE -ne 0) { throw 'Replay component publication failed' }
          }
      - name: Publish component manifest after releases exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python .github/scripts/publish_components_0_2_0.py
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish verified component manifest for desktop 0.2.0"
            if ($LASTEXITCODE -ne 0) { throw 'Manifest commit failed' }
            git push origin main
            if ($LASTEXITCODE -ne 0) { throw 'Manifest publication failed' }
          }

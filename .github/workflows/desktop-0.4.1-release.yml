name: Build WoTQuartermaster 0.4.1 Unified Playstyle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-0.4.1-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: module-manifest-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PySide6==6.8.3 Pillow==11.3.0 PyInstaller==6.14.2
      - name: Verify source and run regression tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((git hash-object desktop/WoTQuartermaster_v0.4.1.txt).Trim() -ne '9630d97ec2aebaa82789095c5bfafc8fea777172') { throw 'Core source hash mismatch' }
          if ((git hash-object modules/battle_performance/0.1.1/battle_performance.qmodule).Trim() -ne '35b03c221e5b527566b1e9132c019b7e1441cac5') { throw 'Module source hash mismatch' }
          python .github/scripts/build_module_index_0_3_2.py
          if ($LASTEXITCODE -ne 0) { throw 'Index generation failed' }
          Copy-Item desktop/module_manager_online.py module_manager_online.py
          Copy-Item desktop/module_manager.py module_manager.py
          Copy-Item desktop/module_runtime.py module_runtime.py
          Copy-Item desktop/module_shared.py module_shared.py
          Copy-Item desktop/WoTQuartermaster_v0.4.1.txt WoTQuartermaster.py
          python -m py_compile WoTQuartermaster.py
          if ($LASTEXITCODE -ne 0) { throw 'Syntax failed' }
          (Get-Content desktop/test_updater_v0.3.3.txt -Raw).Replace('desktop/WoTQuartermaster_v0.3.3.txt','desktop/WoTQuartermaster_v0.4.1.txt') | Set-Content -Encoding utf8 test-updater-041.py
          python test-updater-041.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater regression failed' }
          python .github/scripts/publish_0_4_1.py
          if ($LASTEXITCODE -ne 0) { throw 'Battle module tests failed' }
          python .github/scripts/publish_0_4_1.py --ui
          if ($LASTEXITCODE -ne 0) { throw 'Unified playstyle UI checks failed' }
      - name: Compile portable Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WoTQuartermaster --hidden-import PIL.DdsImagePlugin --hidden-import PIL.Image --hidden-import PIL.PngImagePlugin --add-data "desktop/runtime_modules/index.json;runtime_modules" WoTQuartermaster.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $exe = 'dist/WoTQuartermaster.exe'
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/WoTQuartermaster.sha256.txt -Value "$digest  WoTQuartermaster.exe" -Encoding ascii
      - name: Verify real compiled upgrade and module activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_0_4_1.py --compiled
      - name: Publish verified core and module
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python .github/scripts/publish_0_4_1.py --publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified WoTQuartermaster 0.4.1 core and performance module"
            git push origin main
          fi

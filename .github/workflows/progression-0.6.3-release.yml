name: Verify and publish WoTQuartermaster 0.6.3 progression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/progression-0.6.3-release.yml'
      - 'modules/progression/0.1.3/progression.qmodule'
      - '.github/scripts/test_progression_0_6_3.py'
      - '.github/scripts/publish_progression_0_1_3.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: module-manifest-publication
  cancel-in-progress: false
jobs:
  progression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: End-game and retention regression and module compatibility
        run: |
          python .github/scripts/test_progression_0_6_3.py
          if ($LASTEXITCODE -ne 0) { throw 'Progression and retention regression failed' }
          python -c "import sys,json;sys.path.insert(0,'.github/scripts');import publish_0_6_0 as p;p.VERSIONS['progression']='0.1.3';data=json.load(open('components.json'));data['modules']['progression']=p.entry('progression');p.check_set(p.validate_modules(data)[0],'0.6.0');print('Module compatible')"
          if ($LASTEXITCODE -ne 0) { throw 'Module compatibility failed' }
      - name: Desktop UI and module activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check PySide6==6.8.3 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'UI dependencies failed' }
          @'
          import sys,json,inspect
          sys.path.insert(0,'.github/scripts')
          import publish_0_6_0 as p
          p.CORE_SHA=json.load(open('components.json'))['components']['desktop']['sha256']
          p.VERSIONS['progression']='0.1.3'
          original="{'Overview','Career','Technology Trees','Vehicles','Research'}"
          changed="{'Overview','Career','Technology Trees','Vehicles','Research','Garage & Depot','Data Quality'}"
          src=inspect.getsource(p.ui)
          assert original in src
          exec(compile(src.replace(original,changed),'progression-ui-test','exec'),p.__dict__)
          p.ui()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Desktop UI regression failed' }
      - name: Package verified independent module
        uses: actions/upload-artifact@v4
        with:
          name: progression-0.1.3-test
          path: modules/progression/0.1.3/progression.qmodule
          if-no-files-found: error
      - name: Publish verified independent module
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git checkout -B main origin/main
          python .github/scripts/publish_progression_0_1_3.py --publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified WoTQuartermaster 0.6.3 Progression module"
            git push origin main
          fi
